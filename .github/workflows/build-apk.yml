name: Build Android APK
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
        continue-on-error: true
      - name: Release
        if: hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk PolaroidLive-$VER.apk
          gh release delete android-v$VER -y --cleanup-tag || true
          gh release create android-v$VER PolaroidLive-$VER.apk --title "Polaroid Live Android $VER" --notes "APK cho điện thoại Android" --target ${GITHUB_SHA}
      - name: Publish result to branch apk-out
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir -p /tmp/out && cp build.log /tmp/out/build.log
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk /tmp/out/PolaroidLive-$VER.apk; echo ok > /tmp/out/STATUS; else echo failed > /tmp/out/STATUS; fi
          echo "${GITHUB_SHA}" > /tmp/out/SOURCE_SHA
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan apk-out-tmp
          git rm -rf . -q; git clean -fdxq
          cp /tmp/out/* .
          git add -A && git commit -q -m "APK build ${GITHUB_SHA::7} $(cat STATUS)"
          git push -f origin HEAD:apk-out
